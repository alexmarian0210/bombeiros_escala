
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar Reserva - Bombeiros</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/reservas.css}">

    <style>
        body {
            background-color: #f1f2f4;
            min-height: 100vh;
        }

        .formulario-container {
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f8f9fa;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
        }

        .formulario-header {
            background: #d62828;
            color: white;
            padding: 20px;
        }

        .formulario-header a {
            color: white;
            text-decoration: none;
        }

        .formulario-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .formulario-card h4 {
            color: #d62828;
            font-weight: 800;
        }

        .form-label {
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        .form-control {
            border-radius: 9px;
            padding: 11px;
        }

        .form-control:read-only {
            background-color: #f1f2f4;
            color: #555;
        }

        .btn-danger {
            background-color: #d62828;
            border-color: #d62828;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-danger:hover {
            background-color: #b91f1f;
            border-color: #b91f1f;
        }

        .btn-cancelar {
            border-radius: 9px;
            font-weight: 600;
        }

        .info-reserva {
            background: #fff3f3;
            border-left: 4px solid #d62828;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="formulario-container">

    <!-- CABEÇALHO -->
    <header class="formulario-header">

        <div class="d-flex align-items-center">

            <a href="/escalas" class="me-3">
                <i class="fa-solid fa-arrow-left fa-lg"></i>
            </a>

            <div>
                <h4 class="m-0 fw-bold">Confirmar Reserva</h4>

                <small class="text-white-50">
                    Sistema de Escalas dos Bombeiros
                </small>
            </div>

        </div>

    </header>

    <main class="p-3">

        <!-- MENSAGENS -->
        <div th:if="${mensagemErro}"
             class="alert alert-danger"
             th:text="${mensagemErro}">
        </div>

        <div th:if="${mensagemSucesso}"
             class="alert alert-success"
             th:text="${mensagemSucesso}">
        </div>

        <div class="formulario-card">

            <div class="text-center mb-4">

                <i class="fa-solid fa-calendar-check text-danger fa-3x mb-3"></i>

                <h4>Dados da Reserva</h4>

                <p class="text-muted small mb-0">
                    Confira os dados antes de confirmar seu plantão.
                </p>

            </div>

            <!-- FORMULÁRIO -->
            <form th:action="@{/reservar/confirmar}"
                  method="post"
                  onsubmit="return confirmarReserva();">

                <input type="hidden"
                       name="escalaId"
                       th:value="${escala.id}">

                <!-- DATA -->
                <div class="mb-3">

                    <label class="form-label">
                        <i class="fa-regular fa-calendar me-1 text-danger"></i>
                        Data do Plantão
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${#temporals.format(escala.data, 'dd/MM/yyyy')}"
                           readonly>

                </div>

                <!-- TURNO -->
                <div class="mb-3">

                    <label class="form-label">
                        <i class="fa-regular fa-clock me-1 text-danger"></i>
                        Turno Selecionado
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${
                               escala.turno == 'MANHA' ? 'MANHÃ' : escala.turno
                           }"
                           readonly>

                </div>

                <!-- NOME DO BOMBEIRO -->
                <div class="mb-3">

                    <label class="form-label">
                        <i class="fa-solid fa-user me-1 text-danger"></i>
                        Nome do Bombeiro
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${bombeiroNome}"
                           readonly>

                </div>

                <!-- OBSERVAÇÕES -->
                <div class="mb-4">

                    <label for="observacoes" class="form-label">

                        <i class="fa-regular fa-clipboard me-1 text-danger"></i>

                        Observações

                        <span class="text-muted fw-normal">
                            (Opcional)
                        </span>

                    </label>

                    <textarea class="form-control"
                              id="observacoes"
                              name="observacoes"
                              rows="4"
                              maxlength="1000"
                              placeholder="Informe sua disponibilidade ou alguma observação importante..."></textarea>

                    <small class="text-muted">
                        Campo opcional. Máximo de 1000 caracteres.
                    </small>

                </div>

                <!-- AVISO -->
                <div class="info-reserva mb-4">

                    <i class="fa-solid fa-circle-info me-1 text-danger"></i>

                    Ao confirmar, sua participação será registrada como reserva confirmada.

                </div>

                <!-- BOTÕES -->
                <div class="d-grid gap-2">

                    <button type="submit"
                            class="btn btn-danger py-3">

                        <i class="fa-solid fa-check me-2"></i>

                        Confirmar Reserva

                    </button>

                    <a href="/escalas"
                       class="btn btn-outline-secondary btn-cancelar py-2">

                        <i class="fa-solid fa-xmark me-2"></i>

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

<script>
    function confirmarReserva() {
        return confirm(
            "Deseja realmente confirmar sua reserva neste plantão?"
        );
    }
</script>

</body>
</html>
