
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Reservas - Bombeiros</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/reservas.css}">

    <style>
        body {
            background: #f1f2f4;
            min-height: 100vh;
        }

        .reservas-container {
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f8f9fa;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
            padding-bottom: 35px;
        }

        .reservas-header {
            background: #d62828;
            color: white;
            padding: 20px;
        }

        .reservas-header a {
            color: white;
            text-decoration: none;
        }

        .reserva-card {
            background: white;
            border: 0;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .reserva-data {
            font-weight: 800;
            color: #222;
        }

        .reserva-turno {
            background: #d62828;
            color: white;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .reserva-detalhe {
            color: #777;
            font-size: 13px;
        }

        .sem-reservas {
            background: white;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: #777;
        }

        .sem-reservas i {
            font-size: 38px;
            color: #aaa;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="reservas-container">

    <!-- CABEÇALHO -->
    <header class="reservas-header">

        <div class="d-flex align-items-center">

            <a href="/escalas" class="me-3">
                <i class="fa-solid fa-arrow-left fa-lg"></i>
            </a>

            <div>
                <h4 class="m-0 fw-bold">Minhas Reservas</h4>
                <small class="text-white-50">
                    Consulte seus plantões confirmados
                </small>
            </div>

        </div>

    </header>

    <main class="p-3">

        <!-- MENSAGENS -->
        <div th:if="${mensagemErro}"
             class="alert alert-danger"
             th:text="${mensagemErro}">
        </div>

        <div th:if="${mensagemSucesso}"
             class="alert alert-success"
             th:text="${mensagemSucesso}">
        </div>

        <!-- LISTA DE RESERVAS -->
        <section>

            <div th:each="reserva : ${reservas}"
                 class="reserva-card p-3 mb-3">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h5 class="reserva-data m-0"
                        th:text="${#temporals.format(reserva.escalaPlantao.data, 'dd/MM/yyyy')}">
                        20/11/2026
                    </h5>

                    <span class="reserva-turno"
                          th:text="${reserva.escalaPlantao.turno}">
                        MANHA
                    </span>

                </div>

                <div class="reserva-detalhe mb-2">

                    <i class="fa-regular fa-clock me-2"></i>

                    Início estimado:

                    <strong class="text-dark"
                            th:text="${#temporals.format(reservaService.obterDataHoraInicioPlantao(reserva.escalaPlantao), 'dd/MM/yyyy HH:mm')}">
                        20/11/2026 07:00
                    </strong>

                </div>

                <div class="reserva-detalhe mb-3"
                     th:if="${reserva.observacoes != null and !reserva.observacoes.isEmpty()}">

                    <i class="fa-regular fa-note-sticky me-2"></i>

                    <strong>Observações:</strong>

                    <span th:text="${reserva.observacoes}">
                        Minhas observações
                    </span>

                </div>

                <!-- CANCELAR RESERVA -->
                <form th:action="@{/reservar/cancelar}"
                      method="post"
                      onsubmit="return confirmarCancelamento();">

                    <input type="hidden"
                           name="participacaoId"
                           th:value="${reserva.id}">

                    <button type="submit"
                            class="btn btn-outline-danger w-100">

                        <i class="fa-solid fa-trash-can me-2"></i>

                        Cancelar Reserva

                    </button>

                </form>

            </div>

            <!-- QUANDO NÃO EXISTIREM RESERVAS -->
            <div th:if="${reservas == null or reservas.isEmpty()}"
                 class="sem-reservas">

                <i class="fa-regular fa-calendar-xmark d-block"></i>

                <h5 class="fw-bold text-dark">
                    Nenhuma reserva
                </h5>

                <p class="mb-3">
                    Você não possui nenhuma reserva ativa no momento.
                </p>

                <a href="/escalas" class="btn btn-danger">

                    <i class="fa-solid fa-calendar-days me-1"></i>

                    Consultar escalas

                </a>

            </div>

        </section>

    </main>

</div>

<script>
    function confirmarCancelamento() {
        return confirm(
            "Tem certeza de que deseja cancelar esta reserva?"
        );
    }
</script>

</body>
</html>
